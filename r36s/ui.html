<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>R36S Web File Manager • dArkOS RE</title>
  <link rel="icon" type="image/svg+xml" href="/assets/branding/favicon.svg">
  <style>
    :root {
      --bg: #08070b;
      --surface: rgba(22, 21, 32, 0.85);
      --surface-solid: #161520;
      --surface-hover: rgba(41, 39, 58, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #38bdf8;
      --text: #f3f4f6;
      --text-muted: #9492a6;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --glass-blur: blur(8px); /* Optimized for RK3326 / Mali-G31 GPU fill-rate */
    }

    /* RK3326 / R36S Hardware Acceleration & Performance Hardening */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    @supports not (backdrop-filter: blur(8px)) {
      :root { --surface: #161520; --surface-hover: #211f30; }
    }
    @media (max-width: 768px) {
      :root { --glass-blur: blur(4px); } /* Lighter blur on mobile/console */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transform: translateZ(0); /* Promote body layer */
    }

    /* Glass Header */
    header {
      background: var(--surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      transform: translateZ(0);
      will-change: transform;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #8b5cf6, #38bdf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .brand-badge {
      font-size: 0.65rem;
      background: rgba(139, 92, 246, 0.15);
      color: var(--primary);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      background: var(--surface-hover);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .btn:hover { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.3); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary {
      background: var(--primary);
      border-color: rgba(255,255,255,0.2);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: var(--danger);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Storage Selector Bar */
    .storage-bar {
      background: rgba(17, 16, 25, 0.6);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .storage-bar::-webkit-scrollbar { display: none; }
    .storage-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .storage-pill:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .storage-pill.active {
      background: rgba(139, 92, 246, 0.15);
      border-color: var(--primary);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
    }

    /* Clipboard Banner */
    .clipboard-bar {
      background: rgba(56, 189, 248, 0.1);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding: 10px 24px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--accent);
      animation: slideDown 0.3s ease;
    }
    .clipboard-actions { display: flex; gap: 8px; }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Navigation / Toolbar */
    .toolbar {
      background: var(--surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow);
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      overflow-x: auto;
      max-width: 100%;
      white-space: nowrap;
    }
    .breadcrumb-item {
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }
    .breadcrumb-item:hover { color: var(--accent); }
    .breadcrumb-item.active { color: var(--text); font-weight: 600; cursor: default; }
    .breadcrumb-sep { color: var(--text-muted); opacity: 0.5; }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 0.85rem;
      width: 220px;
      transition: all 0.2s;
    }
    .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
    .search-box input {
      background: none;
      border: none;
      color: var(--text);
      outline: none;
      width: 100%;
      font-size: 0.85srem;
    }

    /* Batch Action Floating Bar */
    .batch-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(22, 21, 32, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-radius: 40px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .batch-bar.visible { transform: translateX(-50%) translateY(0); }
    .batch-count {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      border-right: 1px solid var(--border);
      padding-right: 16px;
    }
    .batch-buttons { display: flex; gap: 8px; }

    /* File Table Container */
    .file-container {
      background: var(--surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th {
      background: rgba(17, 16, 25, 0.5);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
      transition: background 0.15s;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    tr.selected td { background: rgba(139, 92, 246, 0.12); }

    .file-row { cursor: pointer; }
    .file-name-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 500;
    }
    .file-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .icon-folder { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .icon-rom { background: rgba(139, 92, 246, 0.15); color: var(--primary); }
    .icon-archive { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .icon-file { background: rgba(148, 146, 166, 0.15); color: var(--text-muted); }

    .rom-badge {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      border: 1px solid rgba(139, 92, 246, 0.4);
    }

    .file-meta { color: var(--text-muted); font-size: 0.82rem; }
    .file-actions { display: flex; gap: 6px; justify-content: flex-end; }

    /* Drop Zone & Progress Panel */
    .drop-zone {
      border: 2px dashed var(--primary) !important;
      background: rgba(139, 92, 246, 0.05) !important;
    }
    .progress-panel {
      background: var(--surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: none;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .progress-track {
      background: rgba(255,255,255,0.06);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      background: linear-gradient(90deg, #8b5cf6, #38bdf8);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }
    .progress-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Modal Dialogs */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: #181622;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.8);
      animation: modalScale 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalScale {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
    .modal-body { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
    .modal-input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
    }
    .modal-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); }
    .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }

    /* Empty state */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }

    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 10px 16px; }
      main { padding: 16px; gap: 14px; }
      .toolbar { padding: 12px; }
      .search-box { width: 100%; }
      th:nth-child(3), td:nth-child(3) { display: none; } /* hide date on mobile */
    }
  </style>
</head>

  <!-- Modal Dialog -->

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" multiple style="display: none;">

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token') || '';

      let currentPath = "/roms";
      let storageRoots = [];
      let currentFiles = [];
      let selectedPaths = new Set();
      let clipboard = null; // { action: 'copy'|'move', paths: [] }

      // API Helper
      async function apiRequest(endpoint, method = 'GET', data = null) {
        const headers = { 'X-Auth-Token': token };
        const opts = { method, headers };
        if (data) {
          headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(data);
        }
        const resp = await fetch(endpoint, opts);
        if (resp.status === 401) {
          alert("Sessão expirada ou Token inválido. Recarregue a página.");
          throw new Error("Unauthorized");
        }
        return resp;
      }

      // Formatters
      function formatSize(bytes) {
        if (bytes === 0 || bytes === undefined) return "0 B";
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }

      function formatDate(ts) {
        if (!ts) return "-";
        const d = new Date(ts * 1000);
        return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
      }

      // ROM Extension & Console Mapping
      const romExtensions = {
        'gb': 'GB', 'gbc': 'GBC', 'gba': 'GBA', 'nes': 'NES', 'snes': 'SNES',
        'smc': 'SNES', 'sfc': 'SNES', 'n64': 'N64', 'z64': 'N64', 'v64': 'N64',
        'ps1': 'PS1', 'iso': 'ISO', 'bin': 'BIN', 'cue': 'CUE', 'psp': 'PSP',
        'nds': 'NDS', 'gen': 'GEN', 'md': 'MD', 'sms': 'SMS', 'gg': 'GG',
        'zip': 'ZIP', 'rar': 'RAR', '7z': '7Z'
      };

      const systemIcons = {
        'gba': 'gba.svg', 'gb': 'gb.svg', 'gbc': 'gb.svg',
        'snes': 'snes.svg', 'sfc': 'snes.svg', 'smc': 'snes.svg',
        'nes': 'nes.svg', 'fc': 'nes.svg',
        'n64': 'n64.svg', 'z64': 'n64.svg', 'v64': 'n64.svg',
        'nds': 'nds.svg',
        'ps1': 'ps1.svg', 'psx': 'ps1.svg',
        'psp': 'psp.svg',
        'megadrive': 'megadrive.svg', 'md': 'megadrive.svg', 'gen': 'megadrive.svg',
        'arcade': 'arcade.svg', 'mame': 'arcade.svg', 'fba': 'arcade.svg'
      };

      function getFileIcon(name, isDir) {
        if (isDir) {
          const lower = name.toLowerCase();
          if (systemIcons[lower]) {
            return { icon: `<img src="/assets/systems/${systemIcons[lower]}" width="22" height="22" alt="">`, class: 'icon-folder', badge: lower.toUpperCase() };
          }
          return { icon: '<img src="/assets/icons/folder.svg" width="20" height="20" alt="">', class: 'icon-folder' };
        }
        const ext = name.split('.').pop().toLowerCase();
        if (systemIcons[ext]) {
          return { icon: `<img src="/assets/systems/${systemIcons[ext]}" width="22" height="22" alt="">`, class: 'icon-rom', badge: systemIcons[ext].replace('.svg', '').toUpperCase() };
        }
        if (romExtensions[ext]) {
          return { icon: '<img src="/assets/icons/file_rom.svg" width="20" height="20" alt="">', class: 'icon-rom', badge: romExtensions[ext] };
        }
        if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) {
          return { icon: '<img src="/assets/icons/file_zip.svg" width="20" height="20" alt="">', class: 'icon-archive', badge: ext.toUpperCase() };
        }
        if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) {
          return { icon: '<img src="/assets/icons/file_image.svg" width="20" height="20" alt="">', class: 'icon-image' };
        }
        if (['mp3', 'wav', 'ogg', 'flac'].includes(ext)) {
          return { icon: '<img src="/assets/icons/file_audio.svg" width="20" height="20" alt="">', class: 'icon-audio' };
        }
        if (['mp4', 'mkv', 'avi', 'webm'].includes(ext)) {
          return { icon: '<img src="/assets/icons/file_video.svg" width="20" height="20" alt="">', class: 'icon-video' };
        }
        if (['txt', 'log', 'cfg', 'ini', 'gptk'].includes(ext)) {
          return { icon: '<img src="/assets/icons/file_text.svg" width="20" height="20" alt="">', class: 'icon-text' };
        }
        return { icon: '<img src="/assets/icons/file_generic.svg" width="20" height="20" alt="">', class: 'icon-file' };
      }

      // Load Storage Roots
      async function loadStorageRoots() {
        try {
          const resp = await apiRequest('/api/storage');
          const data = await resp.json();
          if (data.success && data.roots) {
            storageRoots = data.roots;
            renderStorageBar();
            if (storageRoots.length > 0 && !currentPath.startsWith(storageRoots[0].path)) {
              currentPath = storageRoots[0].path;
            }
          }
        } catch (e) {
          console.error("Erro ao carregar volumes:", e);
        }
      }

      function renderStorageBar() {
        const bar = document.getElementById('storageBar');
        bar.innerHTML = '';
        storageRoots.forEach(root => {
          const pill = document.createElement('div');
          pill.className = `storage-pill ${currentPath.startsWith(root.path) ? 'active' : ''}`;
          let icon = '/assets/storage/sd.svg';
          if (root.path.includes('/media') || (root.name && root.name.toLowerCase().includes('usb'))) {
            icon = '/assets/storage/usb.svg';
          } else if (root.path === '/' || root.path.startsWith('/mnt')) {
            icon = '/assets/storage/server.svg';
          }
          pill.innerHTML = `<img src="${icon}" width="16" height="16" style="vertical-align: middle; margin-right: 6px;" alt=""> <strong>${root.name || root.path}</strong> <span style="opacity: 0.6; font-size: 0.75rem;">(${formatSize(root.free_space)} livres)</span>`;
          pill.onclick = () => {
            currentPath = root.path;
            selectedPaths.clear();
            loadDirectory(currentPath);
          };
          bar.appendChild(pill);
        });
      }

      // Load Directory Listing
      async function loadDirectory(path) {
        currentPath = path;
        renderStorageBar();
        renderBreadcrumb();

        try {
          const resp = await apiRequest(`/api/fs/list?path=${encodeURIComponent(path)}`);
          const data = await resp.json();
          if (data.success) {
            currentFiles = data.items || [];
            renderFiles(currentFiles);
          } else {
            alert("Erro ao ler diretório: " + (data.error || "Desconhecido"));
          }
        } catch (e) {
          console.error("Falha ao carregar diretório:", e);
        }
      }

      function renderBreadcrumb() {
        const container = document.getElementById('breadcrumbContainer');
        container.innerHTML = '';
        const parts = currentPath.split('/').filter(Boolean);
        
        let accumulated = '';
        const rootItem = document.createElement('span');
        rootItem.className = `breadcrumb-item ${parts.length === 0 ? 'active' : ''}`;
        rootItem.innerHTML = '<img src="/assets/navigation/home.svg" width="14" height="14" style="vertical-align: middle; margin-right: 4px;" alt=""> /';
        rootItem.onclick = () => loadDirectory('/');
        container.appendChild(rootItem);

        parts.forEach((part, idx) => {
          accumulated += '/' + part;
          const targetPath = accumulated;
          const sep = document.createElement('span');
          sep.className = 'breadcrumb-sep';
          sep.textContent = '›';
          container.appendChild(sep);

          const item = document.createElement('span');
          item.className = `breadcrumb-item ${idx === parts.length - 1 ? 'active' : ''}`;
          item.textContent = part;
          if (idx < parts.length - 1) {
            item.onclick = () => loadDirectory(targetPath);
          }
          container.appendChild(item);
        });
      }

      function renderFiles(files) {
        const tbody = document.getElementById('fileTableBody');
        tbody.innerHTML = '';

        if (files.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="empty-state">
                <div class="empty-icon"><img src="/assets/icons/folder_open.svg" width="48" height="48" style="opacity: 0.35;" alt=""></div>
                <div>Pasta vazia ou nenhum arquivo encontrado.</div>
              </td>
            </tr>
          `;
          updateBatchBar();
          return;
        }

        files.forEach(file => {
          const tr = document.createElement('tr');
          tr.className = 'file-row';
          if (selectedPaths.has(file.path)) tr.classList.add('selected');

          const iconInfo = getFileIcon(file.name, file.is_dir);

          tr.innerHTML = `
            <td><input type="checkbox" class="file-checkbox" ${selectedPaths.has(file.path) ? 'checked' : ''}></td>
            <td>
              <div class="file-name-cell">
                <div class="file-icon ${iconInfo.class}">${iconInfo.icon}</div>
                <div>
                  <div style="font-weight: 500;">${file.name}</div>
                  ${iconInfo.badge ? `<span class="rom-badge">${iconInfo.badge}</span>` : ''}
                </div>
              </div>
            </td>
            <td class="file-meta">${file.is_dir ? '-' : formatSize(file.size)}</td>
            <td class="file-meta">${formatDate(file.mtime)}</td>
            <td style="text-align: right;">
              <div class="file-actions">
                ${!file.is_dir ? `<button class="btn" title="Baixar" onclick="event.stopPropagation(); downloadFile('${file.path}')"><img src="/assets/actions/download.svg" width="14" height="14" alt="Baixar"></button>` : ''}
                <button class="btn" title="Renomear" onclick="event.stopPropagation(); promptRename('${file.path}', '${file.name}')"><img src="/assets/actions/rename.svg" width="14" height="14" alt="Renomear"></button>
                <button class="btn btn-danger" title="Excluir" onclick="event.stopPropagation(); deleteSingle('${file.path}')"><img src="/assets/actions/delete.svg" width="14" height="14" alt="Excluir"></button>
              </div>
            </td>
          `;

          const checkbox = tr.querySelector('.file-checkbox');
          checkbox.onchange = (e) => {
            e.stopPropagation();
            if (checkbox.checked) selectedPaths.add(file.path);
            else selectedPaths.delete(file.path);
            tr.classList.toggle('selected', checkbox.checked);
            updateBatchBar();
          };

          tr.onclick = () => {
            if (file.is_dir) {
              selectedPaths.clear();
              loadDirectory(file.path);
            } else {
              checkbox.checked = !checkbox.checked;
              if (checkbox.checked) selectedPaths.add(file.path);
              else selectedPaths.delete(file.path);
              tr.classList.toggle('selected', checkbox.checked);
              updateBatchBar();
            }
          };

          tbody.appendChild(tr);
        });
        updateBatchBar();
      }

      function updateBatchBar() {
        const bar = document.getElementById('batchBar');
        const countEl = document.getElementById('batchCount');
        const count = selectedPaths.size;
        if (count > 0) {
          countEl.textContent = `${count} item(ns) selecionado(s)`;
          bar.classList.add('visible');
        } else {
          bar.classList.remove('visible');
        }
      }

      // Search Filter
      document.getElementById('searchInput').oninput = (e) => {
        const query = e.target.value.toLowerCase();
        if (!query) {
          renderFiles(currentFiles);
          return;
        }
        const filtered = currentFiles.filter(f => f.name.toLowerCase().includes(query));
        renderFiles(filtered);
      };

      // Select All
      document.getElementById('btnSelectAll').onclick = () => {
        if (selectedPaths.size === currentFiles.length) {
          selectedPaths.clear();
        } else {
          currentFiles.forEach(f => selectedPaths.add(f.path));
        }
        renderFiles(currentFiles);
      };

      // Download Single
      window.downloadFile = async function(path) {
        try {
          const resp = await apiRequest(`/api/download/ticket?path=${encodeURIComponent(path)}`);
          const data = await resp.json();
          if (data.success && data.ticket) {
            window.location.href = `/api/download?ticket=${data.ticket}`;
          } else {
            alert("Erro ao gerar link de download.");
          }
        } catch (e) {
          alert("Falha ao solicitar download.");
        }
      };

      // Batch ZIP Download
      document.getElementById('btnDownloadSelected').onclick = async () => {
        if (selectedPaths.size === 0) return;
        const paths = Array.from(selectedPaths);
        showProgressModal("Compactando no R36S...", "Criando arquivo ZIP em segundo plano...");

        try {
          const resp = await apiRequest('/api/tasks/start', 'POST', { action: 'create_zip', paths });
          const json = await resp.json();
          if (!json.success) {
            hideProgressModal();
            alert("Erro ao iniciar compactação: " + json.error);
            return;
          }

          const taskId = json.task_id;
          const poll = setInterval(async () => {
            try {
              const statResp = await apiRequest(`/api/tasks/status?id=${taskId}`);
              const statJson = await statResp.json();
              if (statJson.success) {
                const task = statJson.task;
                updateProgressModal(task.progress_text || "Compactando arquivos...");
                if (task.status === "completed") {
                  clearInterval(poll);
                  hideProgressModal();
                  if (task.result && task.result.download_url) {
                    window.location.href = task.result.download_url;
                  }
                } else if (task.status === "failed") {
                  clearInterval(poll);
                  hideProgressModal();
                  alert("Erro na compactação: " + (task.error || "Falha"));
                }
              }
            } catch (err) {
              clearInterval(poll);
              hideProgressModal();
            }
          }, 1000);
        } catch (e) {
          hideProgressModal();
          alert("Falha de conexão com o console.");
        }
      };

      // Copy / Move Clipboard
      document.getElementById('btnCopySelected').onclick = () => {
        if (selectedPaths.size === 0) return;
        clipboard = { action: 'copy', paths: Array.from(selectedPaths) };
        showClipboardBar();
      };

      document.getElementById('btnMoveSelected').onclick = () => {
        if (selectedPaths.size === 0) return;
        clipboard = { action: 'move', paths: Array.from(selectedPaths) };
        showClipboardBar();
      };

      function showClipboardBar() {
        const bar = document.getElementById('clipboardBar');
        const text = document.getElementById('clipboardText');
        text.textContent = `${clipboard.paths.length} item(ns) copiado(s)/movido(s) para a área de transferência.`;
        bar.style.display = "flex";
      }

      document.getElementById('btnClearClipboard').onclick = () => {
        clipboard = null;
        document.getElementById('clipboardBar').style.display = "none";
      };

      document.getElementById('btnPaste').onclick = async () => {
        if (!clipboard) return;
        const endpoint = clipboard.action === 'copy' ? '/api/fs/copy' : '/api/fs/move';
        try {
          const resp = await apiRequest(endpoint, 'POST', {
            sources: clipboard.paths,
            destination_dir: currentPath
          });
          const res = await resp.json();
          if (res.success) {
            clipboard = null;
            document.getElementById('clipboardBar').style.display = "none";
            selectedPaths.clear();
            loadDirectory(currentPath);
          } else {
            alert("Erro: " + (res.error || "Operação falhou"));
          }
        } catch (e) {
          alert("Falha ao processar área de transferência.");
        }
      };

      // Modals
      const modalOverlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const modalBodyText = document.getElementById('modalBodyText');
      const modalInput = document.getElementById('modalInput');
      const modalBtnCancel = document.getElementById('modalBtnCancel');
      const modalBtnConfirm = document.getElementById('modalBtnConfirm');
      let currentModalAction = null;

      function showModal({ title, message, defaultValue, hasInput, onConfirm, isDanger = false }) {
        modalTitle.textContent = title;
        modalBodyText.textContent = message || "";
        modalBodyText.style.display = message ? "block" : "none";

        if (hasInput) {
          modalInput.style.display = "block";
          modalInput.value = defaultValue || "";
          setTimeout(() => modalInput.focus(), 100);
        } else {
          modalInput.style.display = "none";
        }

        modalBtnConfirm.className = isDanger ? 'btn btn-danger' : 'btn btn-primary';
        modalBtnConfirm.textContent = isDanger ? 'Confirmar Exclusão' : 'Confirmar';
        modalBtnCancel.style.display = "inline-flex";
        modalBtnConfirm.style.display = "inline-flex";

        currentModalAction = onConfirm;
        modalOverlay.style.display = "flex";
      }

      function showProgressModal(title, text) {
        modalTitle.textContent = title;
        modalBodyText.textContent = text;
        modalBodyText.style.display = "block";
        modalInput.style.display = "none";
        modalBtnCancel.style.display = "none";
        modalBtnConfirm.style.display = "none";
        modalOverlay.style.display = "flex";
      }

      function updateProgressModal(text) {
        modalBodyText.textContent = text;
      }

      function hideProgressModal() {
        modalOverlay.style.display = "none";
      }

      modalBtnCancel.onclick = () => { modalOverlay.style.display = "none"; };
      modalBtnConfirm.onclick = async () => {
        if (currentModalAction) {
          await currentModalAction(modalInput.value);
        }
        modalOverlay.style.display = "none";
      };

      // New Folder
      document.getElementById('btnNewFolder').onclick = () => {
        showModal({
          title: "Criar Nova Pasta",
          hasInput: true,
          defaultValue: "",
          onConfirm: async (val) => {
            if (!val.trim()) return;
            const resp = await apiRequest('/api/fs/mkdir', 'POST', { parent_path: currentPath, name: val.trim() });
            const res = await resp.json();
            if (res.success) loadDirectory(currentPath);
            else alert("Erro: " + res.error);
          }
        });
      };

      // Rename
      window.promptRename = function(oldPath, oldName) {
        showModal({
          title: "Renomear Item",
          hasInput: true,
          defaultValue: oldName,
          onConfirm: async (val) => {
            if (!val.trim() || val.trim() === oldName) return;
            const resp = await apiRequest('/api/fs/rename', 'POST', { old_path: oldPath, new_name: val.trim() });
            const res = await resp.json();
            if (res.success) loadDirectory(currentPath);
            else alert("Erro: " + res.error);
          }
        });
      };

      // Delete Single
      window.deleteSingle = function(path) {
        showModal({
          title: "Excluir item?",
          message: `Deseja realmente excluir permanentemente "${path.split('/').pop()}"?`,
          hasInput: false,
          isDanger: true,
          onConfirm: async () => {
            const resp = await apiRequest('/api/fs/delete', 'POST', { paths: [path] });
            const res = await resp.json();
            if (res.success) loadDirectory(currentPath);
            else alert("Erro ao excluir item.");
          }
        });
      };

      // Delete Selected Batch
      document.getElementById('btnDeleteSelected').onclick = () => {
        const count = selectedPaths.size;
        if (count === 0) return;
        showModal({
          title: `Excluir ${count} item(ns)?`,
          message: "Atenção: Os arquivos e diretórios selecionados serão apagados permanentemente do armazenamento do R36S.",
          hasInput: false,
          isDanger: true,
          onConfirm: async () => {
            const resp = await apiRequest('/api/fs/delete', 'POST', { paths: Array.from(selectedPaths) });
            const res = await resp.json();
            if (res.success) {
              selectedPaths.clear();
              loadDirectory(currentPath);
            } else {
              alert("Erro ao excluir alguns itens.");
            }
          }
        });
      };

      // Remote Shutdown
      document.getElementById('btnShutdown').onclick = () => {
        showModal({
          title: "Encerrar Servidor no R36S?",
          message: "O serviço web será finalizado e o R36S retornará imediatamente ao EmulationStation.",
          hasInput: false,
          isDanger: true,
          onConfirm: async () => {
            await apiRequest('/api/shutdown', 'POST');
            document.body.innerHTML = `
              <div style="padding: 60px 20px; text-align: center; max-width: 500px; margin: 0 auto;">
                <h2 style="font-size: 1.5rem; margin-bottom: 12px;">Servidor Encerrado com Sucesso</h2>
                <p style="color: var(--text-muted); line-height: 1.6;">O R36S retornou ao EmulationStation. Você pode fechar esta aba do navegador com segurança.</p>
              </div>
            `;
          }
        });
      };

      // Resumable Chunked Upload Implementation
      const fileInput = document.getElementById('fileInput');
      const btnUpload = document.getElementById('btnUpload');
      const progressPanel = document.getElementById('progressPanel');
      const progressTitle = document.getElementById('progressTitle');
      const progressPercent = document.getElementById('progressPercent');
      const progressBarFill = document.getElementById('progressBarFill');
      const progressBytes = document.getElementById('progressBytes');
      const progressSpeed = document.getElementById('progressSpeed');

      btnUpload.onclick = () => fileInput.click();
      fileInput.onchange = () => {
        if (fileInput.files.length > 0) {
          uploadFilesQueue(Array.from(fileInput.files));
        }
      };

      async function uploadFilesQueue(files) {
        progressPanel.style.display = "block";
        for (let i = 0; i < files.length; i++) {
          await uploadSingleFile(files[i], i + 1, files.length);
        }
        fileInput.value = "";
        progressPanel.style.display = "none";
        loadDirectory(currentPath);
      }

      async function uploadSingleFile(file, index, total) {
        progressTitle.textContent = `[${index}/${total}] Preparando ${file.name}...`;

        const resumeStorageKey = `r36s_upload_${currentPath}_${file.name}_${file.size}`;
        let savedSession = null;
        try {
          const raw = localStorage.getItem(resumeStorageKey);
          if (raw) savedSession = JSON.parse(raw);
        } catch (e) {}

        const initPayload = {
          filename: file.name,
          target_dir: currentPath,
          total_size: file.size,
          fingerprint: `${file.name}:${file.size}:${file.lastModified}`
        };
        if (savedSession) {
          initPayload.resume_id = savedSession.upload_id;
          initPayload.resume_token = savedSession.resume_token;
        }

        const initResp = await apiRequest('/api/upload/init', 'POST', initPayload);
        const initData = await initResp.json();
        if (!initData.success) {
          alert(`Erro ao iniciar upload de ${file.name}: ${initData.error}`);
          return;
        }

        const uploadId = initData.upload_id;
        const resumeToken = initData.resume_token;
        localStorage.setItem(resumeStorageKey, JSON.stringify({ upload_id: uploadId, resume_token: resumeToken }));

        const chunkSize = initData.chunk_size || (2 * 1024 * 1024);
        let offset = initData.received_bytes || 0;
        let chunkIndex = Math.floor(offset / chunkSize);

        if (initData.resumed && offset > 0) {
          progressTitle.textContent = `[${index}/${total}] Retomando ${file.name} de ${formatSize(offset)}...`;
        } else {
          progressTitle.textContent = `[${index}/${total}] Enviando ${file.name}...`;
        }

        const startTime = Date.now();
        let bytesUploadedSinceStart = 0;

        while (offset < file.size) {
          const chunkBlob = file.slice(offset, offset + chunkSize);
          const chunkBuffer = await chunkBlob.arrayBuffer();

          const chunkResp = await fetch('/api/upload/chunk', {
            method: 'POST',
            headers: {
              'X-Auth-Token': token,
              'X-Resume-Token': resumeToken,
              'X-Upload-Id': uploadId,
              'X-Chunk-Index': chunkIndex.toString(),
              'X-Chunk-Offset': offset.toString(),
              'Content-Type': 'application/octet-stream'
            },
            body: chunkBuffer
          });

          if (!chunkResp.ok) {
            const errText = await chunkResp.text();
            throw new Error(`Falha no envio do fragmento ${chunkIndex}: ${errText}`);
          }

          offset += chunkBuffer.byteLength;
          bytesUploadedSinceStart += chunkBuffer.byteLength;
          chunkIndex++;

          const pct = Math.min(100, Math.round((offset / file.size) * 100));
          progressPercent.textContent = pct + "%";
          progressBarFill.style.width = pct + "%";
          progressBytes.textContent = `${formatSize(offset)} / ${formatSize(file.size)}`;

          const elapsedSec = (Date.now() - startTime) / 1000;
          if (elapsedSec > 0.3) {
            const speed = bytesUploadedSinceStart / elapsedSec;
            progressSpeed.textContent = formatSize(speed) + "/s";
          }
        }

        const compResp = await apiRequest('/api/upload/complete', 'POST', {
          upload_id: uploadId,
          resume_token: resumeToken
        });
        const compData = await compResp.json();
        if (!compData.success) {
          alert(`Erro na finalização: ${compData.error}`);
        } else {
          localStorage.removeItem(resumeStorageKey);
        }
      }

      // Drag and Drop
      ['dragenter', 'dragover'].forEach(name => {
        document.body.addEventListener(name, (e) => { e.preventDefault(); document.body.classList.add('drop-zone'); }, false);
      });
      ['dragleave', 'drop'].forEach(name => {
        document.body.addEventListener(name, (e) => { e.preventDefault(); document.body.classList.remove('drop-zone'); }, false);
      });
      document.body.addEventListener('drop', (e) => {
        if (e.dataTransfer.files.length > 0) {
          uploadFilesQueue(Array.from(e.dataTransfer.files));
        }
      });

      // Initial Bootstrap
      loadStorageRoots().then(() => loadDirectory(currentPath));
    })();
  </script>
</body>
</html>
